<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function(){
        var m=window.matchMedia('(prefers-color-scheme: dark)');
        var el=document.createElement('link');
        el.rel='icon'; el.type='image/png';
        el.href=m.matches?'/icon_dark.png?v=2':'/icon_light.png?v=2';
        document.head.appendChild(el);
        m.addEventListener('change',function(e){el.href=e.matches?'/icon_dark.png?v=2':'/icon_light.png?v=2';});
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Argus — Mi Moto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
